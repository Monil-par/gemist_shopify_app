# Staging Partner app profile (SOW 3.1).
# Create a dedicated staging app in Partner Dashboard, then set client_id below.
# Deploy:
#   shopify app config use shopify.app.staging.toml
#   shopify app deploy --config shopify.app.staging.toml
#
# Prefer a separate staging host (or tunnel) from production when available.
# Until a dedicated staging URL exists, this profile mirrors production URLs
# so webhook/proxy shape can still be validated against a staging client_id.

client_id = "REPLACE_WITH_STAGING_CLIENT_ID"
name = "Gemist Staging"
application_url = "https://gemistapp.zooq.app"
embedded = true

[build]
automatically_update_urls_on_dev = true

[webhooks]
api_version = "2026-10"

  [[webhooks.subscriptions]]
  uri = "/webhooks/app/uninstalled"
  topics = [ "app/uninstalled" ]

  [[webhooks.subscriptions]]
  uri = "/webhooks/app/scopes_update"
  topics = [ "app/scopes_update" ]

  [[webhooks.subscriptions]]
  uri = "/webhooks/orders/create"
  topics = [ "orders/create" ]

  [[webhooks.subscriptions]]
  compliance_topics = [ "customers/data_request", "customers/redact", "shop/redact" ]
  uri = "/webhooks/compliance"

[access_scopes]
scopes = "write_products,read_products,write_inventory,read_inventory,read_locations,read_publications,write_publications,read_orders,write_app_proxy"

[auth]
redirect_urls = [
  "https://gemistapp.zooq.app/auth/callback",
  "https://gemistapp.zooq.app/auth/shopify/callback",
  "https://gemistapp.zooq.app/api/auth/callback"
]

[app_proxy]
url = "/api/proxy"
subpath = "gemist"
prefix = "apps"

[shop.metafields.app.gemist_widgets]
name = "Gemist widget styles"
description = "Admin-controlled font, card, and image sizes for Gemist theme widgets"
type = "json"

  [shop.metafields.app.gemist_widgets.access]
  admin = "merchant_read_write"
  storefront = "public_read"

[shop.metafields.app.gemist_commerce]
name = "Gemist commerce settings"
description = "Markup and appointment settings for Gemist collection and PDP"
type = "json"

  [shop.metafields.app.gemist_commerce.access]
  admin = "merchant_read_write"
  storefront = "public_read"
